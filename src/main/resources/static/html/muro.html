<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muro - Mi Diario Estudiante</title>
    <link rel="stylesheet" href="../css/muro.css">
</head>
<body>

<header>
    <h1>Bienvenido, <span id="nombreUsuario"></span> </h1>
    <div class="acciones">
        <button id="chatBtn">
            💬 Chats
            <span id="notificacionBadge" class="badge">0</span>
        </button>

        <button id="perfilBtn">Perfil</button>
        <button id="logout">Cerrar sesión</button>
    </div>
</header>

<div class="layout-container">
    <main class="main-content">
        <section class="crear-post">
            <h2>Crear publicación</h2>
            <textarea id="postTexto" placeholder="¿Qué estás pensando?" rows="3"></textarea>
            <input type="file" id="postImagen" accept="image/*">
            <button id="publicarBtn">Publicar</button>
        </section>

        <section id="feed" class="feed">
        </section>
    </main>

    <aside class="sidebar-right" style="display:none;"> <h3>Sugerencias</h3>
        <div id="listaSugerencias"></div>
    </aside>
</div>

<div id="ventanaChat" class="chat-window">
    <div class="chat-header">
        <span id="chatTitulo">Mis Amigos</span>
        <button onclick="document.getElementById('ventanaChat').style.display='none'" style="background:none; border:none; color:white; font-size:1.5em; cursor:pointer;">&times;</button>
    </div>

    <div id="listaAmigosChat" class="chat-body">
        <p style="text-align:center; color:#777; margin-top: 20px;">Cargando lista...</p>
    </div>

    <div id="zonaConversacion" style="display:none; flex-direction: column; height: 100%;">
        <button onclick="volverALista()" style="background:#f0f2f5; border:none; padding:10px; cursor:pointer; width:100%; text-align:left; color:#333; font-weight:bold; border-bottom:1px solid #ddd;">&laquo; Volver a amigos</button>
        <div id="mensajesContainer" class="chat-body" style="display:flex; flex-direction:column;"></div>
        <div class="chat-footer">
            <input type="text" id="inputMensaje" placeholder="Escribe un mensaje..." style="flex:1; padding:10px; border:1px solid #ddd; border-radius:20px; outline:none;">
            <button id="btnEnviarMsg" style="margin-left:8px; width:40px; height:40px; border-radius:50%; background:#007bff; color:white; border:none; cursor:pointer; display:flex; align-items:center; justify-content:center;">➤</button>
        </div>
    </div>
</div>

<div id="modalUsuario" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:20000; justify-content:center; align-items:center; backdrop-filter: blur(5px);">
    <div style="background:white; padding:25px; border-radius:20px; width:320px; text-align:center; position:relative; box-shadow: 0 10px 25px rgba(0,0,0,0.2); animation: fadeInUp 0.3s ease;">
        <button onclick="document.getElementById('modalUsuario').style.display='none'" style="position:absolute; top:15px; right:20px; background:none; border:none; font-size:1.5em; cursor:pointer; color:#666;">&times;</button>

        <img id="modalAvatar" src="" style="width:90px; height:90px; border-radius:50%; margin-bottom:15px; object-fit:cover; border:4px solid #f0f2f5; box-shadow: 0 5px 15px rgba(0,0,0,0.1);">
        <h3 id="modalNombre" style="margin:0 0 5px 0; color:#333;">Usuario</h3>
        <p style="color:#777; font-size:0.9em; margin-bottom:25px;">¿Quieres conectar con esta persona?</p>

        <button id="btnAgregarMuro" style="background:linear-gradient(135deg, #4CAF50, #45a049); color:white; border:none; padding:12px 0; border-radius:10px; cursor:pointer; width:100%; font-weight:bold; font-size:1rem; box-shadow: 0 5px 15px rgba(76, 175, 80, 0.3); transition: transform 0.2s;">
            Enviar Solicitud de Amistad
        </button>
    </div>
</div>

<script src="../js/muro.js"></script>
</body>
</html>
