<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muro - Mi Diario Estudiante</title>
    <link rel="stylesheet" href="../css/muro.css">
    <style>
        /* ESTILOS DEL CHAT */
        .badge {
            display: none; position: absolute; top: -5px; right: -10px;
            background-color: red; color: white; border-radius: 50%;
            padding: 2px 6px; font-size: 10px; font-weight: bold;
        }
        .chat-window {
            display: none; flex-direction: column; position: fixed;
            bottom: 20px; right: 20px; width: 320px; height: 450px;
            background: white; border: 1px solid #ccc;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            z-index: 10000; border-radius: 10px; overflow: hidden;
            font-family: sans-serif;
        }
        .chat-header {
            background: #007bff; color: white; padding: 12px;
            display: flex; justify-content: space-between; align-items: center;
            font-weight: bold;
        }
        .chat-body { flex: 1; overflow-y: auto; padding: 10px; background: #f4f4f9; }
        .chat-footer { padding: 10px; background: white; display: flex; border-top: 1px solid #eee; }
        .msg-bubble {
            margin: 5px 0; padding: 8px 12px; border-radius: 15px;
            max-width: 80%; font-size: 0.9em; word-wrap: break-word;
        }
        .msg-mio {
            background-color: #dcf8c6; align-self: flex-end;
            margin-left: auto; text-align: right;
        }
        .msg-otro {
            background-color: #ffffff; align-self: flex-start;
            text-align: left; border: 1px solid #ddd;
        }
        .friend-item {
            padding: 12px; border-bottom: 1px solid #eee; cursor: pointer;
            display: flex; align-items: center; gap: 10px;
        }
        .friend-item:hover { background-color: #eef; }
    </style>
</head>
<body>
<header>
    <h1>Bienvenido, <span id="nombreUsuario"></span> </h1>
    <div class="acciones">
        <button id="chatBtn" style="position: relative; margin-right: 15px; cursor: pointer;">
            💬 Chats
            <span id="notificacionBadge" class="badge">0</span>
        </button>

        <button id="perfilBtn">Perfil</button>
        <button id="logout">Cerrar sesión</button>
    </div>
</header>

<main>
    <section class="crear-post">
        <h2>Crear publicación</h2>
        <textarea id="postTexto" placeholder="¿Qué estás pensando?" rows="3"></textarea>
        <input type="file" id="postImagen" accept="image/*">
        <button id="publicarBtn">Publicar</button>
    </section>

    <section id="feed" class="feed">
    </section>
</main>

<div id="ventanaChat" class="chat-window">
    <div class="chat-header">
        <span id="chatTitulo">Mis Amigos</span>
        <button onclick="document.getElementById('ventanaChat').style.display='none'" style="background:none; border:none; color:white; font-size:1.2em; cursor:pointer;">&times;</button>
    </div>

    <div id="listaAmigosChat" class="chat-body">
        <p style="text-align:center; color:#777; margin-top: 20px;">Cargando lista...</p>
    </div>

    <div id="zonaConversacion" style="display:none; flex-direction: column; height: 100%;">
        <button onclick="volverALista()" style="background:#e9e9e9; border:none; padding:8px; cursor:pointer; width:100%; text-align:left; color:#333;">&laquo; Volver a amigos</button>
        <div id="mensajesContainer" class="chat-body" style="display:flex; flex-direction:column;"></div>
        <div class="chat-footer">
            <input type="text" id="inputMensaje" placeholder="Escribe un mensaje..." style="flex:1; padding:8px; border:1px solid #ddd; border-radius:4px;">
            <button id="btnEnviarMsg" style="margin-left:8px; padding: 0 15px; cursor:pointer; background:#007bff; color:white; border:none; border-radius:4px;">➤</button>
        </div>
    </div>
</div>

<script src="../js/muro.js"></script>
</body>
</html>
